<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#02040a;--panel:#07102a;--line:rgba(110,150,240,.22);--blue:#6f93f0;--txt:#e9efff;--dim:#7d8db5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:"Helvetica Neue",Arial,"Malgun Gothic",sans-serif;font-size:13px;line-height:1.6}
  a{color:inherit;text-decoration:none}
  .top{display:flex;justify-content:center;align-items:center;padding:20px 5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(2,4,10,.92);backdrop-filter:blur(6px);z-index:5}
  .clock{font-family:'Space Mono',Consolas,monospace;font-size:11px;letter-spacing:.12em;color:var(--blue);display:flex;align-items:center;gap:8px}
  .pibtn{background:none;border:0;padding:4px;margin:-4px;cursor:pointer;border-radius:50%;transition:.2s;display:flex}
  .pibtn:hover{background:rgba(111,147,240,.18)}
  .pi{width:17px;height:17px;fill:var(--blue);filter:drop-shadow(0 0 4px #7ea4ff)}
  section{max-width:980px;margin:0 auto;padding:60px 20px 10px}
  .hero{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 130px);padding:0 20px;text-align:center}
  .stage{position:relative;width:100%;max-width:640px;display:flex;align-items:center;justify-content:center}
  #bg{position:absolute;left:50%;top:50%;width:min(480px,92vw);height:min(480px,92vw);transform:translate(-50%,-50%);opacity:.55;pointer-events:none}
  .route{position:relative;z-index:1;margin:0;width:100%;max-width:640px;display:block;overflow:visible}
  footer{text-align:center;padding:70px 20px 50px;font-size:9px;letter-spacing:.24em;color:#4b5a82}
  .hit{cursor:pointer}.hit text{transition:.2s}.hit:hover text{fill:#fff}

  /* ===== 팝업 창 공통 ===== */
  #ov,#adm{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;background:#07102a;border:1px solid rgba(150,180,255,.45);border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.75),0 0 34px rgba(60,100,220,.28);overflow:hidden;animation:pop .18s ease-out}
  #ov{width:min(440px,92vw);height:min(400px,74vh);z-index:20}
  #adm{width:min(880px,95vw);height:min(600px,86vh);z-index:30}
  #ov[hidden],#adm[hidden],#pe[hidden]{display:none}
  @keyframes pop{from{opacity:0;scale:.94}to{opacity:1;scale:1}}
  .tb{display:flex;align-items:center;gap:10px;padding:9px 12px;background:linear-gradient(#10245a,#0a1738);border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none;flex:none}
  .tb span{flex:1;font-size:10px;letter-spacing:.24em;color:#cfe0ff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:none;color:#cfe0ff;cursor:pointer;font-size:11px;padding:0;line-height:1}
  .tb button:hover{background:var(--blue);color:#02040a}
  .wb{flex:1;overflow:auto;padding:14px}
  .ic{width:20px;height:20px;fill:#6f93f0;flex:none}
  .empty{color:var(--dim);font-size:12px;padding:10px}

  /* ===== 카테고리 / 글 목록 (새 디자인) ===== */
  .sub{font-size:9px;letter-spacing:.28em;color:var(--dim);margin:2px 2px 12px}
  .lst{display:flex;flex-direction:column;gap:10px}
  .rw{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px 14px 18px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(100deg,rgba(24,52,128,.45),rgba(7,16,42,.55));cursor:pointer;overflow:hidden;transition:.22s}
  .rw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--blue),#3a56b8);opacity:.5;transition:.22s}
  .rw:hover{border-color:rgba(160,190,255,.7);transform:translateX(4px);box-shadow:0 0 18px rgba(80,120,240,.25)}
  .rw:hover::before{opacity:1}
  .rw .no{font-family:'Space Mono',Consolas,monospace;font-size:11px;color:var(--blue);letter-spacing:.08em;flex:none}
  .rw .nm{font-size:14px;font-weight:600;letter-spacing:.03em;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rw .ds{flex:1;min-width:14px;height:1px;background:repeating-linear-gradient(90deg,rgba(111,147,240,.5) 0 2px,transparent 2px 6px)}
  .rw .ct{font-family:'Space Mono',Consolas,monospace;font-size:10px;color:#cfe0ff;background:rgba(111,147,240,.16);border:1px solid var(--line);border-radius:20px;padding:1px 10px;flex:none}
  .rw .ar{color:var(--blue);font-size:17px;flex:none;transition:.2s}
  .rw:hover .ar{transform:translateX(3px);color:#fff}
  .pt{margin:4px 0;font-size:17px;letter-spacing:.02em}
  .pd{color:var(--dim);font-size:10px;letter-spacing:.14em;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .pb{white-space:pre-wrap;line-height:1.9;font-size:13px;color:#cfd9f5;word-break:break-word}
  .pb img{max-width:100%;border-radius:6px;display:block;margin:8px 0}
  .pb a{color:#9bb8ff;text-decoration:underline}
  .pb hr{border:0;border-top:1px solid var(--line);margin:10px 0}
  .pb .q{display:block;border-left:2px solid var(--blue);padding-left:10px;color:var(--dim)}
  .pb .dm{color:var(--dim)}
  .bns{display:flex;flex-direction:column;gap:10px}
  .bn{display:block;position:relative;border:1px solid rgba(110,150,240,.55);border-radius:6px;overflow:hidden;transition:.2s}
  .bn:hover{transform:translateY(-2px);border-color:#9bb8ff;box-shadow:0 0 16px rgba(90,130,255,.35)}
  .bn img,.bn .noimg{width:100%;aspect-ratio:3.4/1;object-fit:cover;display:block;background:#0b1a42}
  .bn .noimg{display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.14em;color:var(--dim)}
  .bn b{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 6px;font-size:10px;letter-spacing:.14em;font-weight:600;background:linear-gradient(transparent,rgba(2,4,10,.88));opacity:0;transition:.2s}
  .bn:hover b{opacity:1}

  /* ===== 관리자 창 ===== */
  .abody{flex:1;display:flex;min-height:0}
  .side{width:170px;flex:none;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:6px;background:rgba(5,10,30,.5)}
  .side button{text-align:left;background:none;border:1px solid transparent;color:#aebce0;padding:9px 14px;border-radius:20px;font:inherit;font-size:12px;letter-spacing:.06em;cursor:pointer;transition:.15s}
  .side button:hover{background:rgba(70,110,220,.14)}
  .side button.on{background:linear-gradient(#17306e,#0e2050);border-color:rgba(150,180,255,.55);color:#fff;font-weight:700}
  .amain{flex:1;overflow:auto;padding:20px 22px}
  .amain h3{margin:0 0 6px;font-size:15px;letter-spacing:.04em}
  .amain .desc{color:var(--dim);font-size:11px;line-height:1.7;margin:0 0 16px}
  .afoot{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);background:rgba(5,10,30,.7);font-size:11px;color:var(--dim);flex:none}
  .afoot #as,.afoot #pc{flex:1}
  .ab,.afoot button,.amain button.ab{font:inherit;font-size:11px;font-weight:700;letter-spacing:.08em;color:#cfe0ff;background:rgba(15,32,84,.8);border:1px solid rgba(110,150,240,.6);border-radius:20px;padding:6px 16px;cursor:pointer;transition:.15s}
  .ab:hover,.afoot button:hover{background:var(--blue);color:#02040a}
  .ab.pri,.afoot button.pri{background:linear-gradient(#3b5cc4,#274096);color:#fff}
  .ab.sm{padding:4px 12px;font-size:10px}
  .ab.dg:hover{background:#d4564f;border-color:#d4564f;color:#fff}
  .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .fld label{font-size:9px;letter-spacing:.22em;color:var(--blue)}
  input[type=text],input[type=password],select,textarea{width:100%;background:#050b1d;border:1px solid var(--line);border-radius:6px;color:var(--txt);font:inherit;font-size:12px;padding:9px 11px;outline:none;transition:.15s}
  input:focus,select:focus,textarea:focus{border-color:rgba(160,190,255,.8);box-shadow:0 0 0 2px rgba(80,120,240,.2)}
  textarea{resize:vertical;min-height:230px;line-height:1.7}
  .arow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .arow .n{width:26px;height:26px;border-radius:50%;background:#2a3d7a;color:#cfe0ff;font-family:'Space Mono',Consolas,monospace;font-size:10px;display:flex;align-items:center;justify-content:center;flex:none}
  .arow .c{font-size:10px;color:var(--dim);white-space:nowrap;flex:none}

}

function ytParse(u){u=String(u||'').trim();let id='',list='';

function makePlayer(){
  const d=document.createElement('div');d.id='yt';document.body.appendChild(d);

    events:{onReady:e=>{YR=true;e.target.setVolume(BG.vol);if(YWANT)e.target.playVideo()},
      onStateChange:e=>{hsUI(e.data===1||e.data===3);if(e.data===0&&!BG.list)e.target.playVideo()},
      onError:()=>{toast('이 영상은 재생할 수 없어요. 다른 링크를 넣어 주세요.');hsUI(false)}}};
  if(BG.list){o.playerVars.listType='playlist';o.playerVars.list=BG.list;o.playerVars.loop=1}

function dragify(win,bar){let dx=0,dy=0,d=false;
  bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=win.getBoundingClientRect();win.style.transform='none';win.style.left=r.left+'px';win.style.top=r.top+'px';dx=e.clientX-r.left;dy=e.clientY-r.top;d=true;bar.setPointerCapture(e.pointerId)});
  bar.addEventListener('pointermove',e=>{if(!d)return;win.style.left=Math.max(0,Math.min(innerWidth-80,e.clientX-dx))+'px';win.style.top=Math.max(0,Math.min(innerHeight-40,e.clientY-dy))+'px'});
  bar.addEventListener('pointerup',()=>{d=false})}

function ready(){return GH.token&&GH.owner&&GH.repo}
async function ghReq(method,body){
  const u=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path||'data.json'}`;
  return fetch(method==='GET'?u+'?ref='+encodeURIComponent(GH.branch||'main')+'&t='+Date.now():u,{method,headers:{Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
}
async function loadRemote(){
  if(!ready()){AD=norm(clone(DATA));sha=null;st('GitHub 설정(저장소·토큰)을 먼저 입력해 주세요.',1);return}
  st('불러오는 중…');
  try{
    const r=await ghReq('GET');
    if(r.status===404){AD=norm(clone(DATA));sha=null;st('data.json이 아직 없어요. 저장하면 새로 만들어져요.')}
    else if(r.status===401||r.status===403)throw new Error('토큰이 올바르지 않거나 권한이 없어요.');
    else if(!r.ok)throw new Error('불러오기 실패 ('+r.status+')');
    else{const j=await r.json();sha=j.sha;AD=norm(JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,''))))));st('최신 내용을 불러왔어요.')}
  }catch(e){if(!AD)AD=norm(clone(DATA));st(e.message,1)}
}
async function saveRemote(){
  if(!ready()){st('토큰·저장소를 먼저 입력해야 저장할 수 있어요.',1);go('gh');return false}
  st('저장 중…');
  try{
    const body={message:'update data.json (admin)',content:btoa(unescape(encodeURIComponent(JSON.stringify(AD,(k,v)=>k[0]==='_'?undefined:v,2)))),branch:GH.branch||'main'};
    if(sha)body.sha=sha;
    const r=await ghReq('PUT',body);
    if(!r.ok){let m='저장 실패 ('+r.status+')';
      if(r.status===401||r.status===403)m='토큰 권한을 확인해 주세요 (Contents: Read and write).';
      if(r.status===404)m='저장소/브랜치를 찾을 수 없어요. GitHub 설정을 확인해 주세요.';
      if(r.status===409||r.status===422)m='다른 곳에서 먼저 수정됐어요. 설정 탭에서 다시 불러온 뒤 시도해 주세요.';
      throw new Error(m)}
    const j=await r.json();sha=j.content.sha;DATA=norm(JSON.parse(JSON.stringify(AD,(k,v)=>k[0]==='_'?undefined:v)));st('저장했어요. 사이트 반영까지 1~2분 걸릴 수 있어요.');return true
  }catch(e){st(e.message,1);return false}
}

  }else if(tab==='site'){
    const S=AD.settings,pv=k=>(PEND[k]?'data:image/png;base64,'+PEND[k]:S[k])||'';
    m.innerHTML=`<h3>사이트 설정</h3><p class="desc">PNG 이미지를 올리면 저장소의 images/ 폴더에 올라가고 사이트에 적용돼요. 이미 올려둔 주소가 있으면 아래 칸에 직접 넣어도 돼요.</p>
    <div class="fld"><label>FAVICON (브라우저 탭 아이콘 · PNG, 정사각형 권장 64×64)</label>
      <div class="arow"><img id="pv_favicon" src="${esc(pv('favicon'))}" style="width:32px;height:32px;object-fit:contain;border:1px solid var(--line);border-radius:4px;background:#050b1d" alt="">
      <input type="file" accept="image/png" onchange="pickImg('favicon',this)" style="flex:1;font-size:11px;color:var(--dim)"><button class="ab sm dg" onclick="S0('favicon')">제거</button></div>
      <input type="text" value="${esc(S.favicon)}" placeholder="또는 이미지 주소 (images/favicon.png)" oninput="AD.settings.favicon=this.value"></div>
    <div class="fld"><label>MOUSE CURSOR (PNG, 128×128 이하 · 권장 32×32)</label>
      <div class="arow"><img id="pv_cursor" src="${esc(pv('cursor'))}" style="width:32px;height:32px;object-fit:contain;border:1px solid var(--line);border-radius:4px;background:#050b1d" alt="">
      <input type="file" accept="image/png" onchange="pickImg('cursor',this)" style="flex:1;font-size:11px;color:var(--dim)"><button class="ab sm dg" onclick="S0('cursor')">제거</button></div>
      <input type="text" value="${esc(S.cursor)}" placeholder="또는 이미지 주소 (images/cursor.png)" oninput="AD.settings.cursor=this.value">
      <div class="arow" style="margin-top:6px"><span class="c" style="color:var(--dim);font-size:10px">클릭 지점(핫스팟)</span><input type="text" value="${esc(S.cx)}" placeholder="X (기본 0)" style="width:90px" oninput="AD.settings.cx=+this.value||0"><input type="text" value="${esc(S.cy)}" placeholder="Y (기본 0)" style="width:90px" oninput="AD.settings.cy=+this.value||0"></div></div>
    <div class="fld"><label>BGM · YOUTUBE 링크 (상단 헤드셋 버튼으로 재생/정지)</label>
      <input type="text" value="${esc(S.bgm)}" placeholder="https://www.youtube.com/watch?v=..." oninput="AD.settings.bgm=this.value">
      <div class="arow" style="margin-top:6px"><span class="c" style="color:var(--dim);font-size:10px">볼륨</span><input type="range" min="0" max="100" value="${S.vol}" style="flex:1" oninput="AD.settings.vol=+this.value;BG.vol=+this.value;document.getElementById('vl').textContent=this.value;if(YP&&YR)try{YP.setVolume(+this.value)}catch(e){}"><span id="vl" class="c" style="width:28px;color:var(--dim);font-size:11px">${S.vol}</span><button class="ab sm" onclick="previewBgm()">미리듣기</button></div></div>
    <button class="ab pri" onclick="saveSite()">저장 (GitHub)</button>`;
  }else if(tab==='links'){
    m.innerHTML=`<h3>링크</h3><p class="desc">Link 창에 배너로 보여요. 배너 이미지는 파일로 업로드해 주세요. 자동으로 200×60 비율로 맞춰 저장소 images/ 폴더에 올라가요(없으면 제목만 표시).</p>
    ${AD.links.map((l,i)=>`<div class="lrow"><div class="arow"><span class="n">${pad(i)}</span><input type="text" value="${esc(l.title)}" placeholder="제목" oninput="AD.links[${i}].title=this.value"><button class="ib" onclick="mv('links',${i},-1)">↑</button><button class="ib" onclick="mv('links',${i},1)">↓</button><button class="ib" onclick="delLink(${i})">✕</button></div><div class="arow"><input type="text" value="${esc(l.url)}" placeholder="이동할 주소 https://" oninput="AD.links[${i}].url=this.value"></div><div class="arow" style="margin:0"><img src="${esc(l._pv||l.image||'')}" style="width:100px;height:30px;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:#050b1d;flex:none" alt=""><input type="file" accept="image/*" onchange="pickLinkImg(${i},this)" style="flex:1;font-size:11px;color:var(--dim)"><button class="ab sm dg" onclick="clearLinkImg(${i})">제거</button></div></div>`).join('')}
    <div style="display:flex;justify-content:space-between;margin-top:14px"><button class="ab" onclick="AD.links.push({title:'',image:'',url:''});render()">+ 링크 추가</button><button class="ab pri" onclick="saveLinks()">저장 (GitHub)</button></div>`;
  }
}
let PEND={favicon:null,cursor:null};
function S0(k){PEND[k]=null;AD.settings[k]='';render()}
function pickImg(k,inp){const f=inp.files[0];if(!f)return;
  if(f.type!=='image/png'){st('PNG 파일만 가능해요.',1);inp.value='';return}
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    if(k==='cursor'&&(img.width>128||img.height>128)){st('커서는 128×128 이하여야 해요 (권장 32×32).',1);inp.value='';return}
    PEND[k]=rd.result.split(',')[1];$('pv_'+k).src=rd.result;st('이미지를 선택했어요. 저장을 눌러 주세요.')};img.src=rd.result};
  rd.readAsDataURL(f);
}
async function putFile(path,b64){
  const u=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`,h={Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json'},br=GH.branch||'main';
  let s;const g=await fetch(u+'?ref='+encodeURIComponent(br)+'&t='+Date.now(),{headers:h});if(g.ok)s=(await g.json()).sha;
  const r=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify({message:'upload '+path,content:b64,branch:br,sha:s})});
  if(!r.ok)throw new Error(path+' 업로드 실패 ('+r.status+')');
}

function pickLinkImg(i,inp){const f=inp.files[0];if(!f)return;
  if(!/^image\//.test(f.type)){st('이미지 파일만 가능해요.',1);inp.value='';return}
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    const W=400,H=120,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    const sc=Math.max(W/img.width,H/img.height),w=img.width*sc,h=img.height*sc;
    x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    const url=c.toDataURL('image/png');
    AD.links[i]._pend=url.split(',')[1];AD.links[i]._pv=url;
    st('배너를 선택했어요. 저장을 눌러 주세요.');render()};
    img.onerror=()=>st('이미지를 읽을 수 없어요.',1);img.src=rd.result};
  rd.readAsDataURL(f);
}
function clearLinkImg(i){const l=AD.links[i];delete l._pend;delete l._pv;l.image='';render()}
async function saveLinks(){
  if(!ready()){st('토큰·저장소를 먼저 입력해야 저장할 수 있어요.',1);go('gh');return}
  try{st('배너 올리는 중…');
    for(let i=0;i<AD.links.length;i++){const l=AD.links[i];
      if(l._pend){const p='images/link_'+Date.now()+'_'+i+'.png';await putFile(p,l._pend);l.image=p;delete l._pend;delete l._pv}}
  }catch(e){st(e.message,1);return}
  if(await saveRemote())render();
}
async function saveSite(){
  if(!ready()){st('토큰·저장소를 먼저 입력해야 저장할 수 있어요.',1);go('gh');return}
  try{st('이미지 올리는 중…');
    for(const k of ['favicon','cursor']){if(PEND[k]){const p='images/'+k+'.png';await putFile(p,PEND[k]);AD.settings[k]=p+'?v='+Date.now();PEND[k]=null}}
  }catch(e){st(e.message,1);return}
  if(await saveRemote()){applySettings(AD.settings);render()}
}
function saveGH(){
  GH={owner:$('g_o').value.trim(),repo:$('g_r').value.trim(),branch:$('g_b').value.trim()||'main',path:$('g_p').value.trim()||'data.json',token:$('g_t').value.trim()};
  if(!GH.token){st('토큰은 필수예요.',1);return}
  try{localStorage.setItem(LS,JSON.stringify(GH))}catch(e){}
  tab='posts';loadRemote().then(render);render();
}
function clearGH(){GH.token='';try{localStorage.setItem(LS,JSON.stringify(GH))}catch(e){}render();st('토큰을 지웠어요.')}
function mv(k,i,d){const a=AD[k],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render()}
function addCat(){AD.categories.push({name:'새 카테고리',posts:[]});render()}
function delCat(i){const c=AD.categories[i];if(!confirm(c.posts.length?`"${c.name}" 카테고리와 안의 글 ${c.posts.length}개가 함께 지워져요. 삭제할까요?`:`"${c.name}" 카테고리를 삭제할까요?`))return;AD.categories.splice(i,1);render()}
function delLink(i){if(!confirm('이 링크를 삭제할까요?'))return;AD.links.splice(i,1);render()}
async function delPost(i,j){if(!confirm('이 글을 삭제할까요?'))return;const bak=AD.categories[i].posts.splice(j,1);render();if(!(await saveRemote())){AD.categories[i].posts.splice(j,0,bak[0]);render()}}

/* 글쓰기 */
function openPe(i,j){
  if(!AD.categories.length){st('먼저 카테고리를 하나 만들어 주세요.',1);go('cats');return}
  editing=(i==null)?null:{i,j};
  const p=editing?AD.categories[i].posts[j]:{title:'',date:today(),body:''};
  $('pcat').innerHTML=AD.categories.map((c,k)=>`<option value="${k}" ${editing&&k===i?'selected':''}>${esc(c.name)}</option>`).join('');
  $('ptitle').value=p.title;$('pdate').value=p.date;$('pbody').value=p.body;cnt();
  $('pe').hidden=false;
}
function closePe(){$('pe').hidden=true;editing=null}
function cnt(){$('pc').textContent=$('pbody').value.length+'자'}
function wrap(a,b){const t=$('pbody'),s=t.selectionStart,e=t.selectionEnd,v=t.value;t.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e);t.focus();t.selectionStart=s+a.length;t.selectionEnd=e+a.length;cnt()}
async function savePost(){
  const title=$('ptitle').value.trim();
  if(!title){st('제목을 입력해 주세요.',1);$('ptitle').focus();return}
  const p={title,date:$('pdate').value.trim()||today(),body:$('pbody').value},ni=+$('pcat').value;
  const snap=clone(AD);
  if(editing&&editing.i===ni)AD.categories[ni].posts[editing.j]=p;
  else{if(editing)AD.categories[editing.i].posts.splice(editing.j,1);AD.categories[ni].posts.unshift(p)}
  if(await saveRemote()){closePe();render()}else{AD=snap}
}
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('pe').hidden)closePe();else if(!$('adm').hidden)closeAdmin();else closeOv()}});
</script>
<script>
/* 클릭 소리 — 작은 물방울 */
let AC;
function drop(){try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(480,t);o.frequency.exponentialRampToValueAtTime(1400,t+.07);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.17);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.2);
}catch(e){}}
addEventListener('pointerdown',drop,true);
</script>
