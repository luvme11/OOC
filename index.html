<script>
/* ===== 대륙 윤곽 (경도,위도) ===== */
const LAND=[
[[-10,36],[-9,43],[-2,44],[-4,48],[2,51],[8,54],[10,58],[5,62],[15,69],[28,71],[40,67],[60,69],[70,73],[100,77],[130,72],[160,70],[180,68],[178,64],[163,60],[156,51],[142,53],[140,46],[130,42],[129,35],[126,38],[122,40],[121,31],[119,25],[110,21],[106,20],[109,12],[105,9],[100,13],[100,7],[104,1],[98,8],[97,17],[92,21],[87,21],[80,15],[77,8],[73,17],[67,25],[57,25],[56,27],[50,30],[48,29],[51,25],[56,26],[59,22],[52,16],[43,13],[35,28],[34,31],[36,36],[27,37],[26,40],[29,41],[23,40],[19,41],[13,45],[16,40],[12,38],[8,44],[3,43],[-1,37]],
[[-17,21],[-6,36],[10,37],[11,33],[32,31],[34,28],[43,12],[51,12],[40,-3],[40,-15],[35,-24],[32,-29],[20,-35],[17,-30],[12,-17],[13,-6],[9,4],[-8,4],[-17,14]],
[[-168,66],[-160,71],[-125,70],[-95,72],[-80,69],[-62,60],[-55,52],[-67,45],[-76,38],[-81,31],[-80,25],[-83,29],[-90,30],[-97,26],[-97,20],[-88,16],[-83,9],[-78,8],[-87,13],[-96,15],[-105,20],[-110,24],[-117,32],[-124,40],[-125,49],[-135,58],[-150,60],[-165,60],[-162,64]],
[[-78,8],[-72,12],[-62,10],[-50,0],[-35,-6],[-39,-14],[-48,-26],[-58,-38],[-65,-42],[-68,-52],[-74,-50],[-73,-37],[-71,-18],[-81,-6],[-80,0],[-77,4]],
[[114,-22],[122,-18],[130,-12],[137,-12],[142,-11],[146,-19],[153,-26],[150,-37],[141,-38],[135,-34],[130,-32],[116,-35],[114,-27]],
[[-55,60],[-45,60],[-20,70],[-20,80],[-60,82],[-70,77]],
[[95,5],[98,4],[104,-2],[106,-6],[102,-4],[96,2]],
[[109,1],[117,7],[119,1],[116,-4],[110,-3]],
[[130,32],[135,34],[140,35],[142,39],[142,43],[145,44],[140,41],[137,37],[132,35]]
];
function inside(lon,lat,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>lat)!==(yj>lat)&&lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)c=!c}return c}

const R2D=Math.PI/180;
const vec=(lon,lat)=>{const a=lon*R2D,b=lat*R2D;return[Math.cos(b)*Math.sin(a),Math.sin(b),Math.cos(b)*Math.cos(a)]};

/* 점 찍을 육지 좌표 미리 계산 */
const dots=[];
for(let lat=-60;lat<=84;lat+=2.1){
  const step=2.1/Math.max(Math.cos(lat*R2D),.12);
  for(let lon=-180;lon<180;lon+=step){
    if(LAND.some(p=>inside(lon,lat,p)))dots.push(vec(lon,lat));
  }
}

/* 공항 */
const ICN={lon:127.0,lat:37.5},SIN={lon:-74.0,lat:40.7};
const A=vec(ICN.lon,ICN.lat),B=vec(SIN.lon,SIN.lat);
const omega=Math.acos(A[0]*B[0]+A[1]*B[1]+A[2]*B[2]);
const TOTAL=omega*6371;
function arc(t,lift=true){
  const s=Math.sin(omega),a=Math.sin((1-t)*omega)/s,b=Math.sin(t*omega)/s;
  const k=lift?1+0.07*Math.sin(Math.PI*t):1;
  return[(a*A[0]+b*B[0])*k,(a*A[1]+b*B[1])*k,(a*A[2]+b*B[2])*k];
}

const cv=document.getElementById('g'),ctx=cv.getContext('2d'),distEl=document.getElementById('dist');
let S=520,dpr=1;
function resize(){dpr=window.devicePixelRatio||1;S=cv.clientWidth;cv.width=cv.height=S*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

let L0=112,P0=18,T0=null,lastEase=0,camL=null,camP=0;const INTRO=4200;
function proj(v){
  const c0=Math.cos(L0*R2D),s0=Math.sin(L0*R2D),cp=Math.cos(P0*R2D),sp=Math.sin(P0*R2D);
  const x1=v[0]*c0-v[2]*s0,z1=v[0]*s0+v[2]*c0;
  const y2=v[1]*cp-z1*sp,z2=v[1]*sp+z1*cp;
  const r=S*0.33;
  return[S/2+r*x1,S/2-r*y2,z2];
}

const FLY=8000,HOLD=1600;
function plane(x,y,ang,sz){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(sz,sz);
  ctx.fillStyle='#fff';ctx.shadowColor='#7ea4ff';ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.moveTo(10,0);ctx.lineTo(2,-2);ctx.lineTo(-3,-10);ctx.lineTo(-6,-10);ctx.lineTo(-3,-2);
  ctx.lineTo(-8,-1.5);ctx.lineTo(-9,-4);ctx.lineTo(-11,-4);ctx.lineTo(-10,0);
  ctx.lineTo(-11,4);ctx.lineTo(-9,4);ctx.lineTo(-8,1.5);ctx.lineTo(-3,2);ctx.lineTo(-6,10);ctx.lineTo(-3,10);ctx.lineTo(2,2);
  ctx.closePath();ctx.fill();ctx.restore();
}
function ping(p,t,strong){
  if(p[2]<0)return;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p[0],p[1],2.2,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(p[0],p[1],6,0,7);ctx.stroke();
  const k=(t%1800)/1800;
  ctx.strokeStyle='rgba(160,190,255,'+(1-k)*(strong?0.9:0.5)+')';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(p[0],p[1],6+k*12,0,7);ctx.stroke();
}

function frame(now){
  if(T0===null)T0=now;
  const el=now-T0;
  const k0=Math.min(el/INTRO,1),e0=1-Math.pow(1-k0,3);
  const tv=arc(0.1+0.8*lastEase,false);
  const tl=Math.atan2(tv[0],tv[2])/R2D,tp=Math.asin(Math.max(-1,Math.min(1,tv[1])))/R2D;
  if(camL===null){camL=tl;camP=tp}
  camL+=(((tl-camL+540)%360)-180)*0.05;camP+=(tp-camP)*0.05;
  L0=camL+360*(1-e0)+Math.sin(el/6000)*4*e0;P0=camP*0.8;
  ctx.clearRect(0,0,S,S);
  const cx=S/2,cy=S/2,r=S*0.33;

  /* 글로우 */
  let g=ctx.createRadialGradient(cx,cy,r*0.8,cx,cy,r*1.5);
  g.addColorStop(0,'rgba(30,70,160,.35)');g.addColorStop(1,'rgba(2,4,10,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*1.5,0,7);ctx.fill();

  /* 구체 */
  g=ctx.createRadialGradient(cx-r*.3,cy-r*.35,r*.1,cx,cy,r);
  g.addColorStop(0,'#10285a');g.addColorStop(1,'#050d24');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(90,130,220,.55)';ctx.lineWidth=1.2;ctx.stroke();
  ctx.strokeStyle='rgba(90,130,220,.18)';ctx.beginPath();ctx.arc(cx,cy,r*1.07,0,7);ctx.stroke();

  /* 경위선 */
  ctx.strokeStyle='rgba(90,130,220,.22)';ctx.lineWidth=.8;
  for(let lon=-180;lon<180;lon+=30){ctx.beginPath();let on=false;
    for(let lat=-90;lat<=90;lat+=4){const p=proj(vec(lon,lat));if(p[2]>0){on?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);on=true}else on=false}ctx.stroke()}
  for(let lat=-60;lat<=60;lat+=30){ctx.beginPath();let on=false;
    for(let lon=-180;lon<=180;lon+=4){const p=proj(vec(lon,lat));if(p[2]>0){on?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);on=true}else on=false}ctx.stroke()}

  /* 점 대륙 */
  for(const d of dots){const p=proj(d);if(p[2]<=0)continue;
    ctx.fillStyle='rgba(190,215,255,'+(0.25+p[2]*0.65)+')';
    ctx.fillRect(p[0]-.8,p[1]-.8,1.6,1.6);}

  /* 비행 진행 */
  const cyc=Math.max(0,el-INTRO+300)%(FLY+HOLD);
  const t=Math.min(cyc/FLY,1);
  const ease=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;lastEase=ease;

  /* 점으로 이어진 비행 꼬리 */
  if(ease>0.005){
    for(let u=0;u<=ease;u+=0.016){
      const p=proj(arc(u)),a=0.12+0.88*Math.pow(u/ease,1.6);
      ctx.fillStyle='rgba(200,220,255,'+a+')';
      ctx.beginPath();ctx.arc(p[0],p[1],1.1+a*0.9,0,7);ctx.fill();
    }
  }

  /* 공항 마커 */
  ping(proj(A),now,t<0.15);
  ping(proj(B),now,t>=1);

  /* 비행기 */
  const pp=proj(arc(ease)),pn=proj(arc(Math.min(ease+0.01,1)));
  let ang=Math.atan2(pn[1]-pp[1],pn[0]-pp[0]);
  if(t>=1){const q=proj(arc(.985));ang=Math.atan2(pp[1]-q[1],pp[0]-q[0])}
  const fade=(t>=1?Math.max(0,1-(cyc-FLY)/HOLD*1.2):1)*Math.min(1,Math.max(0,(el-INTRO+700)/500));
  ctx.globalAlpha=fade;plane(pp[0],pp[1],ang,1.3);ctx.globalAlpha=1;

  distEl.textContent=Math.round(TOTAL*(1-ease))+' km';
  if(t>=1&&typeof leave==='function')leave();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

<script>
/* 클릭 소리 — 작은 물방울 */
let AC;
function drop(){try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(480,t);o.frequency.exponentialRampToValueAtTime(1400,t+.07);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.17);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.2);
}catch(e){}}
addEventListener('pointerdown',drop,true);
/* 비행 도착 → 메인으로 이동 */
const NEXT='ooc_main.html';let leaving=false;
function leave(){if(leaving)return;leaving=true;setTimeout(()=>{document.getElementById('fd').style.opacity=1;setTimeout(()=>{location.href=NEXT},850)},700)}
</script>
